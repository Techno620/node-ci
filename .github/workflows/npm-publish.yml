name: Node ci/cd practice

on: 
  push:
    branches:
      - main
      - devops
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: my_app

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: node setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my_app/package-lock.json

      - name: install dependency
        run: npm ci

      - name: run lint
        run: npm run lint
        

      - name: build application
        run: npm run build

      - name: Run test
        run: npm test
        
